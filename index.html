<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قاهي — المخزون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --espresso:#170f0a; --walnut:#2b1c12; --walnut-light:#3a2718; --line2:#4a3623;
    --marble:#f3ecdd; --marble-dim:#c9bba0;
    --brass:#c99a4a; --brass-bright:#e3b866; --brass-deep:#8a6427;
    --sage:#7fa06a; --lilac:#9b8bc4; --teal:#5fa89c;
    --clay:#c05a3d; --clay-bg:#3a1f18;
    --radius-lg:26px; --radius-md:16px; --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--espresso);
    background-image:radial-gradient(circle at 10% -10%,#35240f 0%,transparent 45%),radial-gradient(circle at 100% 0%,#2a1c10 0%,transparent 40%);
    color:var(--marble); font-family:'Tajawal','Inter',sans-serif; min-height:100vh; padding-bottom:60px;
  }
  body[dir="ltr"]{ font-family:'Inter',sans-serif; }
  .font-display{ font-family:'Aref Ruqaa',serif; }
  body[dir="ltr"] .font-display{ font-family:'Playfair Display',serif; }
  a{color:inherit;} button{ font-family:inherit; cursor:pointer; border:none; } svg{ display:block; }
  ::-webkit-scrollbar{ height:0; width:6px; } ::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:6px; }

  .hero{ position:relative; height:230px; background-size:cover; background-position:center 60%; border-radius:0 0 46px 12px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.4); }
  body[dir="ltr"] .hero{ border-radius:0 0 12px 46px; }
  .hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(23,15,10,0.15) 0%,rgba(23,15,10,0.55) 55%,rgba(23,15,10,0.92) 100%); }
  .hero-top{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:16px 16px 0; z-index:2; }
  .icon-btn{ background:rgba(23,15,10,0.55); backdrop-filter:blur(6px); border:1px solid rgba(243,236,221,0.18); border-radius:999px; color:var(--marble); padding:8px 14px; font-size:12.5px; display:flex; align-items:center; gap:6px; font-weight:600; transition:.15s; }
  .icon-btn:active{ transform:scale(0.94); }
  .hero-brand{ position:absolute; bottom:16px; right:20px; left:20px; z-index:2; }
  body[dir="ltr"] .hero-brand{ text-align:left; }
  .hero-brand h1{ font-size:40px; margin:0; color:var(--brass-bright); line-height:1; text-shadow:0 2px 14px rgba(0,0,0,0.5); }
  .hero-brand p{ margin:6px 0 0; font-size:12.5px; color:var(--marble-dim); letter-spacing:0.3px; }
  .sync-pill{ position:absolute; bottom:16px; left:20px; z-index:2; display:flex; align-items:center; gap:6px; background:rgba(23,15,10,0.55); backdrop-filter:blur(6px); border:1px solid rgba(243,236,221,0.18); border-radius:999px; padding:5px 10px; font-size:10.5px; color:var(--marble-dim); }
  body[dir="ltr"] .sync-pill{ left:auto; right:20px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:#e08064; }
  .sync-dot.live{ background:var(--sage); box-shadow:0 0 6px var(--sage); }

  .wrap{ max-width:760px; margin:0 auto; padding:0 14px; }
  .user-bar{ margin-top:-22px; position:relative; z-index:3; background:var(--walnut); border:1px solid var(--line2); border-radius:var(--radius-md); padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:0 8px 22px rgba(0,0,0,0.35); }
  .user-info{ display:flex; align-items:center; gap:10px; }
  .user-avatar{ width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--brass-bright),var(--brass-deep)); color:var(--espresso); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex-shrink:0; }
  .user-text .name{ font-size:14px; font-weight:700; color:var(--marble); }
  .user-text .role{ font-size:11px; color:var(--marble-dim); margin-top:1px; }
  .user-text .role.manager{ color:var(--brass); }
  .switch-btn{ background:var(--walnut-light); border:1px solid var(--line2); color:var(--marble-dim); padding:8px 12px; border-radius:999px; font-size:11.5px; font-weight:600; }

  .stats-row{ display:flex; gap:10px; margin-top:14px; }
  .stat-card{ flex:1; background:var(--walnut); border:1px solid var(--line2); border-radius:14px; padding:12px 14px; }
  .stat-card .num{ font-family:'Playfair Display',Georgia,serif; font-size:22px; font-weight:800; color:var(--marble); }
  .stat-card.low .num{ color:#e08064; }
  .stat-card .lbl{ font-size:10.5px; color:var(--marble-dim); margin-top:2px; font-weight:600; }

  .alert-bar{ background:var(--clay-bg); border:1px solid #5c3126; border-radius:var(--radius-md); padding:13px 16px; margin-top:14px; display:none; }
  .alert-bar.show{ display:block; }
  .alert-bar .title{ color:#e79c85; font-weight:800; font-size:13.5px; margin-bottom:7px; display:flex; align-items:center; gap:7px; }
  .alert-bar .items{ font-size:12.5px; color:#e8c9be; line-height:2; }

  .setup-box{ background:var(--clay-bg); border:1px solid #5c3126; border-radius:var(--radius-md); padding:18px 18px; margin-top:14px; font-size:13px; line-height:2; color:#e8c9be; }
  .setup-box b{ color:#fff; }
  .setup-box code{ background:rgba(0,0,0,0.3); padding:2px 6px; border-radius:6px; font-size:11.5px; }

  .tabs{ display:flex; gap:8px; margin-top:16px; overflow-x:auto; padding-bottom:4px; }
  .tab{ flex-shrink:0; background:var(--walnut); border:1px solid var(--line2); color:var(--marble-dim); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; transition:.15s; }
  .tab.active{ background:linear-gradient(135deg,var(--brass-bright),var(--brass-deep)); color:var(--espresso); border-color:transparent; }

  .toolbar{ display:flex; gap:8px; margin-top:14px; }
  .btn-primary{ background:linear-gradient(135deg,var(--brass-bright),var(--brass-deep)); color:var(--espresso); font-weight:800; padding:12px 18px; font-size:13.5px; border-radius:12px; display:flex; align-items:center; gap:7px; flex:1; justify-content:center; transition:.1s; }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-ghost{ background:var(--walnut); border:1px solid var(--line2); color:var(--marble-dim); padding:12px 16px; border-radius:12px; font-size:13px; display:flex; align-items:center; gap:6px; }

  .cat-section-title{ display:flex; align-items:center; gap:8px; margin:22px 2px 4px; color:var(--brass-bright); font-weight:800; font-size:13.5px; }
  .cat-section-title .line{ flex:1; height:1px; background:var(--line2); }

  .item-card{ background:var(--walnut); border:1px solid var(--line2); border-radius:var(--radius-md); padding:15px 16px; margin-top:12px; transition:.15s; }
  .item-card.low{ border-color:#6b3527; background:linear-gradient(180deg,#33201a,var(--walnut) 45%); }
  .item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .item-name-row{ display:flex; align-items:center; gap:8px; }
  .cat-dot{ width:7px; height:7px; border-radius:50%; background:var(--brass); flex-shrink:0; }
  .cat-dot.cups{ background:var(--teal); } .cat-dot.powder{ background:var(--lilac); } .cat-dot.filters{ background:var(--sage); }
  .item-name{ font-size:15.5px; font-weight:800; color:var(--marble); }
  .item-meta{ font-size:11px; color:var(--marble-dim); margin-top:4px; }
  .qty-block{ text-align:center; flex-shrink:0; }
  body[dir="rtl"] .qty-block{ text-align:left; } body[dir="ltr"] .qty-block{ text-align:right; }
  .qty-num{ font-size:26px; font-weight:800; font-family:'Playfair Display',Georgia,serif; line-height:1; color:var(--marble); }
  .qty-num.low{ color:#e08064; }
  .qty-unit{ font-size:11px; color:var(--marble-dim); margin-top:2px; }
  .tag-low{ display:inline-flex; align-items:center; gap:4px; margin-top:6px; font-size:10px; font-weight:700; background:var(--clay); color:#fff; padding:3px 9px; border-radius:20px; }

  .item-actions{ display:flex; gap:8px; margin-top:13px; }
  .item-actions button{ flex:1; padding:10px 6px; font-size:12.5px; font-weight:700; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:5px; transition:.1s; }
  .item-actions button:active{ transform:scale(0.96); }
  .btn-use{ background:var(--espresso); border:1px solid var(--line2); color:var(--marble); }
  .btn-restock{ background:#33422f; border:1px solid #4b6144; color:#cfe6c4; }
  .btn-edit{ background:transparent; border:1px solid var(--line2); color:var(--marble-dim); flex:0 0 42px; }

  .empty{ text-align:center; color:var(--marble-dim); padding:46px 20px; font-size:13.5px; line-height:1.8; }
  .empty svg{ margin:0 auto 10px; opacity:0.5; }

  .log-toggle{ text-align:center; margin-top:26px; }
  .log-toggle button{ background:none; color:var(--marble-dim); font-size:12.5px; text-decoration:underline; padding:6px; }
  .log-list{ display:none; margin-top:10px; font-size:12px; color:var(--marble-dim); background:var(--walnut); border-radius:var(--radius-md); border:1px solid var(--line2); padding:12px 16px; max-height:240px; overflow-y:auto; }
  .log-list.show{ display:block; }
  .log-row{ padding:6px 0; border-bottom:1px dashed var(--line2); } .log-row:last-child{ border-bottom:none; } .log-row .t{ opacity:0.6; }

  .overlay{ position:fixed; inset:0; background:rgba(10,6,3,0.7); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.show{ display:flex; } .overlay.center{ align-items:center; }
  .modal{ background:var(--walnut); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:22px 20px 28px; border:1px solid var(--line2); border-bottom:none; max-height:88vh; overflow-y:auto; }
  .modal.centered{ border-radius:22px; border-bottom:1px solid var(--line2); margin:0 16px; }
  .modal h3{ margin:0 0 16px; font-size:16.5px; color:var(--brass-bright); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--marble-dim); margin-bottom:6px; font-weight:600; }
  .field input, .field select{ width:100%; background:var(--espresso); border:1px solid var(--line2); border-radius:10px; padding:11px 12px; color:var(--marble); font-size:14px; font-family:inherit; }
  .field input:focus, .field select:focus{ outline:1px solid var(--brass); }
  .two-col{ display:flex; gap:10px; } .two-col .field{ flex:1; }
  .cat-choice{ display:flex; gap:8px; flex-wrap:wrap; }
  .cat-choice button{ flex:1; min-width:100px; padding:10px 6px; border-radius:10px; background:var(--espresso); border:1px solid var(--line2); color:var(--marble-dim); font-size:12.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; }
  .cat-choice button.active{ border-color:var(--brass); color:var(--brass-bright); }

  .quick-amounts{ display:flex; gap:8px; margin-bottom:16px; }
  .quick-amounts button{ flex:1; padding:11px 0; background:var(--espresso); border:1px solid var(--line2); color:var(--marble); border-radius:10px; font-size:13.5px; font-weight:700; }
  .quick-amounts button.active{ border-color:var(--brass); color:var(--brass-bright); }

  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions button{ flex:1; padding:12px 0; font-size:14px; border-radius:12px; font-weight:700; }
  .btn-cancel{ background:transparent; border:1px solid var(--line2); color:var(--marble-dim); }
  .btn-danger-outline{ background:transparent; border:1px solid #5c3126; color:var(--clay); font-size:12px !important; padding:10px 0 !important; margin-top:10px; }
  .loading{ text-align:center; color:var(--marble-dim); padding:40px; font-size:13px; }

  .name-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .name-opt{ background:var(--espresso); border:1px solid var(--line2); border-radius:12px; padding:14px 10px; text-align:center; color:var(--marble); font-weight:700; font-size:13.5px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .name-opt .badge{ font-size:10px; color:var(--brass); font-weight:700; }
  .name-opt .av{ width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--brass-bright),var(--brass-deep)); color:var(--espresso); display:flex; align-items:center; justify-content:center; font-weight:800; }

  .lang-grid{ display:flex; gap:12px; }
  .lang-opt{ flex:1; background:var(--espresso); border:1px solid var(--line2); border-radius:16px; padding:22px 10px; text-align:center; color:var(--marble); display:flex; flex-direction:column; align-items:center; gap:8px; }
  .lang-opt .flag{ font-size:26px; } .lang-opt .lbl{ font-weight:800; font-size:15px; } .lang-opt:active{ border-color:var(--brass); }

  @media (max-width:380px){ .hero{ height:200px; } .hero-brand h1{ font-size:32px; } }
</style>
</head>
<body dir="rtl">

<div class="hero" id="heroImg">
  <div class="hero-top">
    <button class="icon-btn" id="langBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
      <span id="langBtnText">EN</span>
    </button>
    <button class="icon-btn" style="pointer-events:none;"><span class="font-display" style="font-size:14px;">☕</span></button>
  </div>
  <div class="hero-brand">
    <h1 class="font-display" id="brandTitle">قاهي</h1>
    <p id="brandTagline">إدارة مخزون الفرع</p>
  </div>
  <div class="sync-pill"><span class="sync-dot" id="syncDot"></span><span id="syncText">…</span></div>
</div>

<div class="wrap">
  <div class="user-bar">
    <div class="user-info">
      <div class="user-avatar" id="avatarLetter">?</div>
      <div class="user-text"><div class="name" id="currentUserName">—</div><div class="role" id="currentUserRole"></div></div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;"><button class="switch-btn" id="switchUserBtn" style="display:none;"></button><button class="switch-btn" id="logoutBtn">تسجيل خروج</button></div>
  </div>

  <div id="setupBox" class="setup-box" style="display:none;"></div>

  <div class="stats-row">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl" id="statTotalLbl"></div></div>
    <div class="stat-card low"><div class="num" id="statLow">0</div><div class="lbl" id="statLowLbl"></div></div>
    <div class="stat-card"><div class="num" id="statCats">0</div><div class="lbl" id="statCatsLbl"></div></div>
  </div>

  <div id="alertBar" class="alert-bar">
    <div class="title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span id="alertTitleText"></span>
    </div>
    <div id="alertItems" class="items"></div>
  </div>

  <div class="tabs" id="tabsRow"></div>

  <div class="toolbar">
    <button class="btn-primary" id="addItemBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span id="addItemBtnText"></span>
    </button>
    <button class="btn-ghost" id="adminUsersBtn" style="display:none;">👥 <span id="adminUsersBtnText">المستخدمون</span></button>
    <button class="btn-ghost" id="refreshBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>

  <div id="itemsList"><div class="loading" id="loadingText"></div></div>

  <div class="log-toggle"><button id="logToggle"></button></div>
  <div id="logList" class="log-list"></div>
</div>


<div class="overlay center show" id="loginOverlay" style="z-index:100;">
  <div class="modal centered">
    <h3 style="text-align:center;font-size:24px;">قاهي ☕</h3>
    <p style="text-align:center;color:var(--marble-dim);font-size:12px;margin:-8px 0 18px;">تسجيل الدخول لإدارة المخزون</p>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="loginUsername" dir="ltr" autocomplete="username" placeholder="admin@qahi.com">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="loginPassword" dir="ltr" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div id="loginError" style="display:none;background:var(--clay-bg);border:1px solid #5c3126;color:#e79c85;border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px;text-align:center;"></div>
    <button class="btn-primary" id="loginBtn" style="width:100%;">تسجيل الدخول</button>
  </div>
</div>

<div class="overlay center" id="langOverlay">
  <div class="modal centered">
    <h3 id="langModalTitle">اختر اللغة / Choose your language</h3>
    <div class="lang-grid">
      <button class="lang-opt" onclick="chooseLang('ar')"><div class="flag">🇸🇦</div><div class="lbl">العربية</div></button>
      <button class="lang-opt" onclick="chooseLang('en')"><div class="flag">🇬🇧</div><div class="lbl">English</div></button>
    </div>
  </div>
</div>

<div class="overlay" id="userOverlay">
  <div class="modal"><h3 id="userModalTitle"></h3><div class="name-grid" id="nameGrid"></div></div>
</div>

<div class="overlay" id="adminUsersOverlay">
  <div class="modal">
    <h3 id="adminUsersTitle">إدارة المستخدمين</h3>
    <div id="adminUsersList" class="empty" style="padding:20px 0;"></div>
    <button class="btn-cancel" id="adminUsersClose" style="width:100%;margin-top:8px;">إغلاق</button>
  </div>
</div>

<div class="overlay" id="itemOverlay">
  <div class="modal">
    <h3 id="itemModalTitle"></h3>
    <div class="field"><label id="lblCategory"></label><div class="cat-choice" id="catChoice"></div></div>
    <div class="two-col">
      <div class="field"><label id="lblNameAr">اسم الصنف (عربي)</label><input type="text" id="fNameAr" dir="rtl"></div>
      <div class="field"><label id="lblNameEn">Item name (English)</label><input type="text" id="fNameEn" dir="ltr"></div>
    </div>
    <div class="field"><label id="lblQty"></label><input type="number" id="fQty" placeholder="0"></div>
    <div class="field"><label id="lblUnit"></label><select id="fUnit"></select></div>
    <div class="field"><label id="lblThreshold"></label><input type="number" id="fThreshold" placeholder="5"></div>
    <div class="modal-actions"><button class="btn-cancel" id="itemCancel"></button><button class="btn-primary" id="itemSave" style="flex:1"></button></div>
    <button class="btn-danger-outline" id="itemDelete" style="display:none; width:100%;"></button>
  </div>
</div>

<div class="overlay" id="qtyOverlay">
  <div class="modal">
    <h3 id="qtyModalTitle"></h3>
    <div class="quick-amounts" id="quickAmounts">
      <button data-v="1">1</button><button data-v="5">5</button><button data-v="10">10</button><button data-v="custom" id="btnCustom"></button>
    </div>
    <div class="field" id="customQtyField" style="display:none;"><label id="lblQuantity"></label><input type="number" id="qtyCustom" placeholder="0"></div>
    <div class="modal-actions"><button class="btn-cancel" id="qtyCancel"></button><button class="btn-primary" id="qtyConfirm" style="flex:1"></button></div>
  </div>
</div>

<script type="module">
/* =====================================================================
   إعدادات Firebase — لازم تعبي هالقيم من مشروعك في Firebase قبل الرفع.
   شوف الشرح في الرسالة اللي وصلتك عشان تعرف وين تجيب هالقيم بالضبط.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBz62h-NH1a2Y8GRzwaZ7MGMMKqXQ-tuLA",
  authDomain: "qahi-inventory.firebaseapp.com",
  projectId: "qahi-inventory",
  storageBucket: "qahi-inventory.firebasestorage.app",
  messagingSenderId: "32649315521",
  appId: "1:32649315521:web:2c3fdd7167d9710f78c040"
};

/* ---------- FIREBASE AUTH ---------- */
async function loginUser(){
  const email=document.getElementById('loginUsername').value.trim().toLowerCase();
  const password=document.getElementById('loginPassword').value;
  const err=document.getElementById('loginError');
  const btn=document.getElementById('loginBtn');
  err.style.display='none';
  if(!email || !password){ err.textContent='اكتب البريد الإلكتروني وكلمة المرور.'; err.style.display='block'; return; }
  if(SETUP_NEEDED){ err.textContent='Firebase غير مكتمل الربط.'; err.style.display='block'; return; }
  btn.disabled=true; btn.textContent='جارٍ تسجيل الدخول...';
  try{
    const cred=await signInWithEmailAndPassword(auth,email,password);
    firebaseUser=cred.user;
  }catch(e){
    console.error(e);
    err.textContent='البريد الإلكتروني أو كلمة المرور غير صحيحة.';
    err.style.display='block';
  }finally{ btn.disabled=false; btn.textContent='تسجيل الدخول'; }
}
document.getElementById('loginBtn').onclick=loginUser;
document.getElementById('loginPassword').addEventListener('keydown',e=>{ if(e.key==='Enter') loginUser(); });

function logoutUser(){
  if(auth) signOut(auth).catch(console.error);
}
document.getElementById('loginBtn').onclick=loginUser;
document.getElementById('loginPassword').addEventListener('keydown',e=>{ if(e.key==='Enter') loginUser(); });


/* ---------- FIREBASE (shared, live-synced across every device) ---------- */
async function loadCurrentProfile(){
  if(!firebaseUser || !db) return null;
  const snap=await getDoc(doc(db,'users',firebaseUser.uid));
  if(!snap.exists()) throw new Error('USER_PROFILE_MISSING');
  const data=snap.data();
  const role=String(data.role||'employee').toLowerCase();
  if(!['admin','manager','employee'].includes(role)) throw new Error('INVALID_ROLE');
  currentProfile={...data,uid:firebaseUser.uid};
  currentRole=role;
  return currentProfile;
}
async function initFirebase(){
  if(SETUP_NEEDED){ document.getElementById('setupBox').style.display='block'; items=DEFAULT_SEED.map(s=>({id:uid(),...s})); setSyncStatus(false); return; }
  try{
    if(!db){ const app=initializeApp(FIREBASE_CONFIG); auth=getAuth(app); db=getFirestore(app); }
    storeRef=doc(db,'qahi','inventory');
    onSnapshot(storeRef,(snap)=>{
      if(snap.exists()){ const data=snap.data(); items=data.items||[]; log=data.log||[]; }
      else if(!firstSnapshotDone && isManager()){ const seeded=DEFAULT_SEED.map(s=>({id:uid(),...s})); items=seeded; log=[]; setDoc(storeRef,{items:seeded,log:[]}); }
      firstSnapshotDone=true; setSyncStatus(true); render();
    },(err)=>{ console.error('Firestore error',err); setSyncStatus(false); });
  }catch(e){ console.error(e); setSyncStatus(false); }
}
async function persistState(){
  if(SETUP_NEEDED || !storeRef){ render(); return; }
  try{ await setDoc(storeRef,{items,log},{merge:false}); }catch(e){ console.error('write failed',e); alert('تعذر حفظ التغيير. تحقق من صلاحيات Firebase.'); }
}
function setSyncStatus(ok){ const dot=document.getElementById('syncDot'),txt=document.getElementById('syncText'); if(!dot)return; dot.classList.toggle('live',ok); txt.textContent=ok?t().syncLive:t().syncOff; }

function addLogEntry(entry){ log = [{...entry, ts: Date.now()}, ...log].slice(0,50); }

function formatLogRow(l){
  const name=lang==='ar'?l.name_ar:l.name_en, who=lang==='ar'?l.who_ar:l.who_en, unit=unitLabel(l.unit);
  let text='';
  if(lang==='ar'){
    if(l.type==='use') text=`استُخدم ${l.amount} ${unit} من "${name}" — ${who}`;
    else if(l.type==='restock') text=`تمت تعبئة ${l.amount} ${unit} إلى "${name}" — ${who}`;
    else if(l.type==='add') text=`تم إضافة صنف جديد: "${name}" (${l.amount} ${unit}) — ${who}`;
    else if(l.type==='edit') text=`تم تعديل بيانات "${name}" — ${who}`;
    else if(l.type==='delete') text=`تم حذف صنف: "${name}" — ${who}`;
  } else {
    if(l.type==='use') text=`Used ${l.amount} ${unit} from "${name}" — ${who}`;
    else if(l.type==='restock') text=`Restocked ${l.amount} ${unit} to "${name}" — ${who}`;
    else if(l.type==='add') text=`Added new item: "${name}" (${l.amount} ${unit}) — ${who}`;
    else if(l.type==='edit') text=`Edited "${name}" — ${who}`;
    else if(l.type==='delete') text=`Deleted item: "${name}" — ${who}`;
  }
  const time=new Date(l.ts).toLocaleString(lang==='ar'?'ar-SA':'en-US',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
  return {text,time};
}

async function openAdminUsers(){
  if(!isAdmin()){ alert(t().adminOnly); return; }
  const overlay=document.getElementById('adminUsersOverlay'), list=document.getElementById('adminUsersList');
  overlay.classList.add('show'); list.innerHTML='<div class="loading">جارٍ تحميل المستخدمين...</div>';
  try{
    const snap=await getDocs(collection(db,'users'));
    const rows=[]; snap.forEach(d=>rows.push({uid:d.id,...d.data()}));
    if(!rows.length){ list.innerHTML='<div class="empty">لا يوجد مستخدمون في users.</div>'; return; }
    list.innerHTML=rows.map(u=>{
      const role=String(u.role||'employee').toLowerCase();
      const email=escapeHtml(u.email||u.uid); const name=escapeHtml(u.name||email.split('@')[0]);
      const disabled=u.uid===firebaseUser.uid?'disabled':'';
      return `<div style="background:var(--espresso);border:1px solid var(--line2);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;justify-content:space-between"><div style="min-width:0"><div style="font-weight:800">${name}</div><div style="font-size:10.5px;color:var(--marble-dim);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis">${email}</div></div><select data-uid="${u.uid}" class="role-select" ${disabled} style="width:110px;background:var(--walnut);color:var(--marble);border:1px solid var(--line2);padding:8px;border-radius:8px"><option value="admin" ${role==='admin'?'selected':''}>${t().admin}</option><option value="manager" ${role==='manager'?'selected':''}>${t().manager}</option><option value="employee" ${role==='employee'?'selected':''}>${t().employee}</option></select></div>`;
    }).join('');
    list.querySelectorAll('.role-select').forEach(sel=>sel.addEventListener('change',async e=>{
      const uid=e.target.dataset.uid, role=e.target.value;
      if(uid===firebaseUser.uid){ e.target.value=currentRole; alert(t().cannotChangeSelf); return; }
      try{ await setDoc(doc(db,'users',uid),{role},{merge:true}); alert(t().roleSaved); }catch(err){ console.error(err); alert('تعذر تحديث الصلاحية.'); }
    }));
  }catch(e){ console.error(e); list.innerHTML='<div class="empty">تعذر تحميل المستخدمين. تأكد من Firestore Rules.</div>'; }
}

  return `

    <div class="item-top">
      <div>

        <div class="item-meta">${t().alertAt}: ${it.threshold} ${unitLabel(it.unit)}</div>
        ${isLow?`<span class="tag-low">${t().lowTag}</span>`:''}
      </div>
      <div class="qty-block"><div class="qty-num ${isLow?'low':''}">${it.qty}</div><div class="qty-unit">${unitLabel(it.unit)}</div></div>
    </div>
    <div class="item-actions">
      ${mgr?`<button class="btn-use" onclick="openQtyModal('${it.id}','use')">${icon('minus',13)} ${t().use}</button>`:''}
      ${mgr?`<button class="btn-restock" onclick="openQtyModal('${it.id}','restock')">${icon('plus',13)} ${t().restock}</button>`:''}
      ${mgr?`<button class="btn-edit" onclick="openEditModal('${it.id}')">${icon('gear',14)}</button>`:''}
    </div>
  </div>`;
}

function render(){
  if(!lang) return;
  document.getElementById('statTotal').textContent=items.length;
  document.getElementById('statLow').textContent=items.filter(it=>Number(it.qty)<=Number(it.threshold)).length;
  document.getElementById('statCats').textContent=CATEGORIES.length;

  const alertBar=document.getElementById('alertBar'), alertItems=document.getElementById('alertItems');
  const lowItems=items.filter(it=>Number(it.qty)<=Number(it.threshold));
  if(lowItems.length>0){ alertBar.classList.add('show'); alertItems.innerHTML=lowItems.map(it=>`• ${escapeHtml(itemLabel(it))} — ${t().remaining} ${it.qty} ${unitLabel(it.unit)}`).join('<br>'); }
  else{ alertBar.classList.remove('show'); }

  const list=document.getElementById('itemsList');
  if(activeCategory==='all'){
    const groups=CATEGORIES.map(c=>({cat:c,list:items.filter(it=>it.category===c.id)})).filter(g=>g.list.length>0);
    if(groups.length===0){ list.innerHTML=`<div class="empty">${icon('box',34)}<div>${t().empty}</div><div style="opacity:0.7;margin-top:4px;">${t().emptyAdd}</div></div>`; }
    else{
      list.innerHTML=groups.map(g=>`
        <div class="cat-section-title">${icon(g.cat.icon,14)} ${catLabel(g.cat.id)}<span class="line"></span></div>
        ${g.list.map(itemCardHtml).join('')}
      `).join('');
    }
  } else {
    const filtered=items.filter(it=>it.category===activeCategory);
    list.innerHTML = filtered.length===0
      ? `<div class="empty">${icon('box',34)}<div>${t().empty}</div><div style="opacity:0.7;margin-top:4px;">${t().emptyAdd}</div></div>`
      : filtered.map(itemCardHtml).join('');
  }

  const logList=document.getElementById('logList');
  logList.innerHTML = log.length===0 ? `<div>${t().noHistory}</div>` : log.map(l=>{ const f=formatLogRow(l); return `<div class="log-row">${escapeHtml(f.text)} <span class="t">— ${f.time}</span></div>`; }).join('');
}
function renderLogToggle(){ const btn=document.getElementById('logToggle'), el=document.getElementById('logList'); btn.textContent=el.classList.contains('show')?t().hideHistory:t().history; }

document.getElementById('addItemBtn').onclick=()=>{ if(!isManager()){ alert(t().managerOnly); return; } openAddModal(); };
document.getElementById('refreshBtn').onclick=()=>{ render(); };

function renderCatChoice(){ const el=document.getElementById('catChoice'); el.innerHTML=CATEGORIES.map(c=>`<button type="button" class="${itemModalCategory===c.id?'active':''}" onclick="pickCategory('${c.id}')">${icon(c.icon,13)} ${catLabel(c.id)}</button>`).join(''); }
function pickCategory(id){ itemModalCategory=id; renderCatChoice(); }

function openAddModal(){
  editingItemId=null; itemModalCategory='coffee';
  document.getElementById('itemModalTitle').textContent=t().addTitle;
  document.getElementById('fNameAr').value=''; document.getElementById('fNameEn').value='';
  document.getElementById('fQty').value='';
  renderUnitOptions(); document.getElementById('fUnit').value='kg';
  document.getElementById('fThreshold').value='';
  document.getElementById('itemDelete').style.display='none';
  renderCatChoice(); document.getElementById('itemOverlay').classList.add('show');
}
function openEditModal(id){
  if(!isManager()){ alert(t().managerOnly); return; }
  const it=items.find(x=>x.id===id); if(!it) return;
  editingItemId=id; itemModalCategory=it.category;
  document.getElementById('itemModalTitle').textContent=t().editTitle;
  document.getElementById('fNameAr').value=it.name_ar; document.getElementById('fNameEn').value=it.name_en;
  document.getElementById('fQty').value=it.qty;
  renderUnitOptions(); document.getElementById('fUnit').value=it.unit;
  document.getElementById('fThreshold').value=it.threshold;
  document.getElementById('itemDelete').style.display=isAdmin()?'block':'none';
  renderCatChoice(); document.getElementById('itemOverlay').classList.add('show');
}
document.getElementById('itemCancel').onclick=()=>document.getElementById('itemOverlay').classList.remove('show');
document.getElementById('itemSave').onclick=async()=>{
  if(!isManager()){ alert(t().managerOnly); return; }
  const name_ar=document.getElementById('fNameAr').value.trim(), name_en=document.getElementById('fNameEn').value.trim();
  const qty=Number(document.getElementById('fQty').value||0), unit=document.getElementById('fUnit').value, threshold=Number(document.getElementById('fThreshold').value||0);
  if(!name_ar||!name_en){ alert(t().nameRequired); return; }
  const who=profileName();
  if(editingItemId){
    const it=items.find(x=>x.id===editingItemId);
    it.name_ar=name_ar; it.name_en=name_en; it.qty=qty; it.unit=unit; it.threshold=threshold; it.category=itemModalCategory;
    addLogEntry({type:'edit',name_ar,name_en,unit,amount:qty,who_ar:who,who_en:who});
  } else {
    items.push({id:uid(),name_ar,name_en,qty,unit,threshold,category:itemModalCategory});
    addLogEntry({type:'add',name_ar,name_en,unit,amount:qty,who_ar:who,who_en:who});
  }
  document.getElementById('itemOverlay').classList.remove('show');
  await persistState();
};
document.getElementById('itemDelete').onclick=async()=>{
  if(!isAdmin()){ alert(t().adminOnly); return; }
  const it=items.find(x=>x.id===editingItemId); if(!it) return;
  if(!confirm(`${t().confirmDelete} "${itemLabel(it)}"?`)) return;
  const who=profileName();
  items=items.filter(x=>x.id!==editingItemId);
  addLogEntry({type:'delete',name_ar:it.name_ar,name_en:it.name_en,unit:it.unit,amount:0,who_ar:who,who_en:who});
  document.getElementById('itemOverlay').classList.remove('show');
  await persistState();
};

function openQtyModal(id,mode){
  if(!firebaseUser){ return; }
  if(mode==='restock' && !isManager()){ alert(t().managerOnly); return; }
  qtyTargetId=id; qtyMode=mode; qtySelected=null;
  document.querySelectorAll('#quickAmounts button').forEach(b=>b.classList.remove('active'));
  document.getElementById('customQtyField').style.display='none'; document.getElementById('qtyCustom').value='';
  const it=items.find(x=>x.id===id);
  document.getElementById('qtyModalTitle').textContent=`${mode==='use'?t().useFrom:t().restockTo}: ${itemLabel(it)}`;
  document.getElementById('qtyOverlay').classList.add('show');
}
document.getElementById('quickAmounts').addEventListener('click',(e)=>{
  const btn=e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#quickAmounts button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  if(btn.dataset.v==='custom'){ qtySelected='custom'; document.getElementById('customQtyField').style.display='block'; }
  else{ qtySelected=Number(btn.dataset.v); document.getElementById('customQtyField').style.display='none'; }
});
document.getElementById('qtyCancel').onclick=()=>document.getElementById('qtyOverlay').classList.remove('show');
document.getElementById('qtyConfirm').onclick=async()=>{
  let amount=qtySelected; if(qtySelected==='custom'){ amount=Number(document.getElementById('qtyCustom').value||0); }
  if(!amount||amount<=0){ alert(t().pickQty); return; }
  const it=items.find(x=>x.id===qtyTargetId);
  if(!it || !firebaseUser) return;
  if(qtyMode==='restock' && !isManager()){ alert(t().managerOnly); return; }
  if(qtyMode==='use' && !isManager()){ alert(t().managerOnly); return; }
  const who=profileName();
  if(qtyMode==='use'){ it.qty=Math.max(0,Number(it.qty)-amount); addLogEntry({type:'use',name_ar:it.name_ar,name_en:it.name_en,unit:it.unit,amount,who_ar:who,who_en:who}); }
  else{ it.qty=Number(it.qty)+amount; addLogEntry({type:'restock',name_ar:it.name_ar,name_en:it.name_en,unit:it.unit,amount,who_ar:who,who_en:who}); }
  document.getElementById('qtyOverlay').classList.remove('show');
  await persistState();
};

document.getElementById('logToggle').onclick=()=>{ document.getElementById('logList').classList.toggle('show'); renderLogToggle(); };
document.getElementById('itemOverlay').addEventListener('click',(e)=>{ if(e.target.id==='itemOverlay') e.target.classList.remove('show'); });
document.getElementById('qtyOverlay').addEventListener('click',(e)=>{ if(e.target.id==='qtyOverlay') e.target.classList.remove('show'); });

document.getElementById('heroImg').style.backgroundImage="url('__COVER_IMAGE_BASE64__')";

/* expose functions used via inline onclick to the global scope (module scripts are scoped) */
Object.assign(window, { chooseLang, setCategory, pickCategory, openQtyModal, openEditModal });

/* ---------- boot ---------- */
async function boot(){
  const storedLang=loadLangLocal(); lang=storedLang||'ar'; applyLang();
  if(SETUP_NEEDED){ document.getElementById('loginOverlay').classList.remove('show'); await initFirebase(); render(); return; }
  const app=initializeApp(FIREBASE_CONFIG); auth=getAuth(app); db=getFirestore(app);
  onAuthStateChanged(auth,async user=>{
    firebaseUser=user; currentProfile=null; currentRole=null;
    if(user){
      try{
        await loadCurrentProfile();
        document.getElementById('loginOverlay').classList.remove('show');
        await initFirebase();
        render();
      }catch(e){
        console.error(e);
        await signOut(auth);
        document.getElementById('loginError').textContent=e.message==='USER_PROFILE_MISSING'?'الحساب موجود في Authentication لكن لم تتم إضافة users/{UID} في Firestore.':'صلاحية المستخدم غير صحيحة.';
        document.getElementById('loginError').style.display='block';
      }
    }else{
      currentEmployee=null; currentProfile=null; currentRole=null;
      document.getElementById('loginOverlay').classList.add('show');
      document.getElementById('loginUsername').focus();
      renderUserBar();
    }
  });
}
boot();
</script>
</body>
</html>
